<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دریافت لینک ویدیو</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#171923;font-family:Tahoma,Arial,sans-serif;padding:22px 12px}.main{max-width:660px;margin:auto;background:#fff;border:1px solid #e9e9ee;border-radius:18px;padding:25px;box-shadow:0 12px 35px #1b1b3910}h2{margin:0 0 8px;color:#e11d48}p{color:#666;margin:10px 0 18px}input{width:100%;direction:ltr;text-align:left;border:1px solid #ddd;border-radius:10px;padding:15px;font-size:15px}button{width:100%;margin-top:10px;border:0;background:#e11d48;color:white;padding:14px;border-radius:10px;cursor:pointer;font-size:15px}button:disabled{opacity:.55;cursor:wait}.item{border:1px solid #eee;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}.item small{display:block;color:#71717a;margin-top:5px}.item a{color:#fff;background:#15803d;padding:10px 14px;border-radius:8px;text-decoration:none;white-space:nowrap}#msg{color:#b91c1c;margin-top:14px;line-height:1.8}.note{font-size:12px;color:#777;margin-top:18px;line-height:1.8}h3{font-size:16px;line-height:1.8}</style></head><body><main class="main"><h2>🎬 دریافت لینک دانلود ویدیو</h2><p>لینک ویدیوی عمومی یوتیوب را وارد کنید.</p><form id="form"><input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." aria-label="لینک یوتیوب"><button id="go">نمایش کیفیت‌ها</button></form><div id="msg" role="alert"></div><div id="result"></div><div class="note">کیفیت‌های بالاتر ممکن است تصویر بدون صدا باشند. لینک‌ها موقت‌اند و گاهی به‌دلیل محدودیت‌های یوتیوب در مرورگر باز نمی‌شوند. فقط محتوایی را دریافت کنید که اجازه دانلود آن را دارید.</div></main><script>
const form=document.getElementById('form'),btn=document.getElementById('go'),msg=document.getElementById('msg'),out=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='در حال بررسی...';msg.textContent='';out.replaceChildren();const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),65000);try{const r=await fetch('/api/formats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value.trim()}),signal:ctl.signal});const data=await r.json();if(!r.ok)throw Error(data.error||'خطای سرور');const h=document.createElement('h3');h.textContent=data.title;out.append(h);if(!data.formats?.length)msg.textContent='کیفیت قابل‌دریافتی پیدا نشد.';(data.formats||[]).forEach(f=>{const row=document.createElement('div');row.className='item';const details=document.createElement('div'),strong=document.createElement('strong'),small=document.createElement('small'),a=document.createElement('a');strong.textContent=f.quality+' — '+f.ext;small.textContent=f.type;details.append(strong,small);a.href=f.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='دریافت';row.append(details,a);out.append(row)});}catch(err){msg.textContent=err.name==='AbortError'?'زمان درخواست تمام شد؛ دوباره امتحان کنید.':err.message}finally{clearTimeout(timeout);btn.disabled=false;btn.textContent='نمایش کیفیت‌ها'}});
</script></body></html>
